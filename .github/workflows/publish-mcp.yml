name: Publish to MCP Registry

# The MCP registry listing is just static metadata (server.json) for the remote server at
# https://lifescored.com/mcp. Re-publish when that file changes (and bump its `version`).
# Domain ownership is proven by /.well-known/mcp-registry-auth, already served by the app — so
# this only needs the Ed25519 signing key, kept as the MCP_PRIVATE_KEY repo secret.
on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl --fail --location --silent --show-error -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Skip if this version is already published
        id: guard
        run: |
          LOCAL=$(jq -r .version server.json)
          PUBLISHED=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=lifescored" \
            | jq -r --arg v "$LOCAL" '[.servers[] | select(.server.name=="com.lifescored/mcp" and .server.version==$v)] | length')
          if [ "$PUBLISHED" != "0" ]; then
            echo "com.lifescored/mcp version $LOCAL is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        if: steps.guard.outputs.skip == 'false'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login http --domain lifescored.com --private-key "$MCP_PRIVATE_KEY"

      - name: Validate and publish
        if: steps.guard.outputs.skip == 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher publish
